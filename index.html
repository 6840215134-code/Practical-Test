<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าเว็บแนะนำช่อง YouTube ของฉัน</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <img src="bbbb.jpg" alt="โลโก้ช่อง YouTube" width="300">

    <h1>ยินดีต้อนรับสู่เว็บไซต์ช่องมองไปอ่านมา</h1>

    <p>เว็บไซต์นี้สร้างขึ้นเพื่อใช้ในการเรียน และเพื่อแนะนำช่อง YouTube ของผม</p>

    <h3>เนื้อหาภายในช่องของผม:</h3>
    <ul>
        <li>การทำมังงะจีน</li>
        <li>การทำมังฮวา เกาหลี</li>
        <li>การทำมังงะที่ตัวเองชอบ</li>
    </ul>

    <p>
        ติดตามช่องของผมได้ที่: 
        <a href="https://www.youtube.com/@maz-r2b" target="_blank">คลิกเพื่อไปยัง YouTube</a>
    </p>

    <hr>
    <h3>ส่วนทดลองระบบ</h3>
    <button onclick="showWelcome()">แสดงข้อความต้อนรับ</button>
    
    <div style="margin-top: 15px;">
        <input type="text" id="userInput" placeholder="กรอกชื่อของคุณ">
        <button onclick="sayHello()">ทักทาย</button>
        <p id="greetingResult"></p>
    </div>

    <footer>
        <p>© 2026 My Profile Website</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
